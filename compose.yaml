services:
  database:
    build:
      context: .
      dockerfile: docker-runtime/Dockerfile.database
    image: t-delayer:database
    environment:
      POSTGRES_DB: delayerdb
      POSTGRES_USER: delayer
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      TZ: UTC
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U delayer -d delayerdb']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  delayer:
    build:
      context: .
      dockerfile: docker-runtime/Dockerfile
    image: t-delayer:runtime
    environment:
      PGHOST: database
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      WEB_PASSWORD: ${WEB_PASSWORD:?Set WEB_PASSWORD in .env}
      WEB_COOKIE_SECURE: ${WEB_COOKIE_SECURE:-0}
      WEB_PORT: "8080"
      DELAYER_CONTROLLER_ID: ${DELAYER_CONTROLLER_ID:-delayer}
      DELAYER_MULTICAST_INTERFACE: ${DELAYER_MULTICAST_INTERFACE:-}
      TZ: UTC
    volumes:
      - ${DELAYER_INSTANCES_FILE:-./docker-runtime/instances.json}:/etc/delayer/instances.json:ro
      - video:/home/video
      - web-auth:/var/lib/delayer
    ports:
      - '${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080'
    depends_on:
      database:
        condition: service_healthy
    stop_grace_period: 40s
    restart: unless-stopped
volumes:
  database:
  video:
  web-auth:
