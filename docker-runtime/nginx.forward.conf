# The runtime serves the UI and session API. This container only
# publishes the TCP port while the runtime uses Linux host networking for UDP.
user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    access_log /dev/stdout;
    server_tokens off;
    client_max_body_size 1m;
    server {
        listen 8080;
        location / {
            proxy_pass http://unix:/run/delayer-web/nginx.sock;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 40s;
        }
    }
}
